# Generated by src/build/build.ts. Do not edit: the sha256 values pin the vendored tools.
name: "check"
on:
  push:
    paths-ignore:
      - "in/**"
      - "sent/**"
  pull_request: {}
permissions:
  contents: "read"
env:
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
jobs:
  check:
    runs-on: "ubuntu-latest"
    timeout-minutes: 5
    steps:
      - name: "Checkout"
        uses: "actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803"  # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: "Verify the vendored tools"
        id: "verify"
        run: |
          sha256sum -c - <<'PINNED'
          c8de7f60b659e60f5703be75f90348981ac2c44cdd3b05ef29a81f2482839ae7  .github/agent-ecosystem/check.mjs
          2baa9595590f8f13bf7d1a193ab1bf0e6183aa595076d9a1f6bb7239d1215380  .github/agent-ecosystem/index.mjs
          a963e7140782be2e4043e440f81a3078fbbfb866f6c462f2fa238d46a910e46c  .gitleaks.toml
          f961e21cbc088324c72c888367c60ac84248b5ea0ba9154d85cd5c9db9b75035  .yamllint.yaml
          PINNED
      - name: "Changed range"
        id: "range"
        env:
          EVENT: "${{ github.event_name }}"
          BEFORE: "${{ github.event.before }}"
          PR_BASE: "${{ github.event.pull_request.base.sha }}"
        run: |
          if [ "$EVENT" = "pull_request" ]; then base="$PR_BASE"; else base="$BEFORE"; fi
          if [ -z "$base" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then base=""; fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
      - name: "Schemas, frontmatter, tables and index"
        env:
          BASE: "${{ steps.range.outputs.base }}"
          REPO_NAME: "${{ github.event.repository.name }}"
        run: |
          command -v yamllint >/dev/null || pipx install yamllint
          if [ -n "$BASE" ]; then
            node .github/agent-ecosystem/check.mjs --repo-name "$REPO_NAME" --base "$BASE" --head HEAD --yamllint
          else
            node .github/agent-ecosystem/check.mjs --repo-name "$REPO_NAME" --all --yamllint
          fi
      - name: "Secret detection"
        if: "${{ always() }}"
        env:
          BASE: "${{ steps.range.outputs.base }}"
          GITLEAKS_CONFIG_TOML: |
            # Secret detection for every repo of the org. Detection only: on the free plan nothing blocks a push,
            # so a finding means the founder replaces the secret at once.
            title = "Agent Ecosystem secret detection"

            [extend]
            useDefault = true

            [[rules]]
            id = "signed-link"
            description = "A signed link to a warehouse object. A signed link is never written into a repo or a despatch."
            regex = '''(?i)[?&](?:x-amz-signature|x-goog-signature|sig|signature)=[0-9a-z%/+=_-]{16,}'''
            keywords = ["x-amz-signature", "x-goog-signature", "sig=", "signature="]

            [[rules]]
            id = "session-code-or-run-credential"
            description = "A signed session code or run credential pasted into a file."
            regex = '''(?i)\b(?:session[_-]?code|run[_-]?credential)\s*[:=]\s*["']?[A-Za-z0-9_\-.]{20,}'''
            keywords = ["session", "credential"]

            [[allowlists]]
            description = "known fake age test vector in template history"
            commits = ["20ea9f90e03e21b18f63f074427d6d67b9c14132"]

            [[allowlists]]
            description = "stand-in AWS keys in installer tests and a PEM marker constant, rewritten at run time after these commits"
            commits = ["e652953f36ffe9095017a24b47f078d4a5a336bb", "a88da114f30a67e9c343c5e762e2871051f9f180"]

            [[allowlists]]
            description = "a stand-in mail key in the monitor installer test, built at run time after this commit"
            commits = ["e9c13a730251105ab051fbfa60106201df50d49b"]
        run: |
          status=0
          if [ -e .gitleaksignore ]; then
            echo "::error file=.gitleaksignore::a .gitleaksignore would silence secret detection; secrets are never ignored"
            status=1
            rm -f .gitleaksignore
          fi
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tgz" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
          : > "$RUNNER_TEMP/empty.gitleaksignore"
          if [ -n "$BASE" ]; then range="${BASE}..HEAD"; else range="HEAD"; fi
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact --exit-code 1 --ignore-gitleaks-allow --gitleaks-ignore-path "$RUNNER_TEMP/empty.gitleaksignore" --log-opts="--text --diff-merges=remerge $range" . || status=1
          exit "$status"
